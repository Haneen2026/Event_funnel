<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation – True Care Workshop</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body class="confirmation-page">
  <header>
    <div class="logo">
      <img src="assests/LOGO.png" alt="True Care Workshop Logo">
    </div>
  </header>

  <div class="confirmation-container">
    <h1 class="confirmation-title">🌿 Registration Confirmed 🌿</h1>
    <p id="confirmation-text" class="confirmation-message">Thank you! Your spot is reserved at True Care Workshop.</p>

    <div class="share-section">
      <p class="share-text">Want to invite a friend?</p>
      <div class="share-buttons">
        <button id="whatsapp-btn" class="share-btn">WhatsApp</button>
        <button id="email-btn" class="share-btn">Email</button>
        <button id="copy-btn" class="share-btn">Copy Link</button>
      </div>
    </div>
  </div>
  <!-- POPUP WRAPPER -->
<div id="popupOverlay" style="
position: fixed;
inset: 0;
background: rgba(0,0,0,0.6);
display: none;
align-items: center;
justify-content: center;
z-index: 9999;
">

<div style="
    width: 90%;
    max-width: 600px;
    height: 70vh;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
">

    <button id="closePopup" style="
        position: absolute;
        top: 10px;
        right: 15px;
        background: black;
        color: white;
        border: none;
        border-radius: 50%;
        width: 35px;
        height: 35px;
        cursor: pointer;
        font-size: 18px;
    ">×</button>

    <iframe src="postFunnel.html" style="width:100%; height:100%; border:none;"></iframe>

</div>
</div>


</body>
</html>
